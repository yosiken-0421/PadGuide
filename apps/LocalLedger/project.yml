name: LocalLedger
options:
  bundleIdPrefix: com.yosiken0421.localkakeibo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LocalLedgerCore:
    path: Core
targets:
  LocalLedger:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: LocalLedgerCore
    settings:
      base:
        PRODUCT_NAME: LocalLedger
        PRODUCT_BUNDLE_IDENTIFIER: com.yosiken0421.localkakeibo
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: まいにち家計簿
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
