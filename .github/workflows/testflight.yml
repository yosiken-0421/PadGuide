name: iOS TestFlight

# GitHub の「Actions」→「iOS TestFlight」→「Run workflow」で実行（スマホのブラウザからでもOK）
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26
    env:
      BUNDLE_PREFIX: ${{ vars.BUNDLE_PREFIX || 'com.yosiken0421.padguide' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secrets に $v が登録されていません"; exit 1; fi
          done
          if [ -z "$BUNDLE_PREFIX" ]; then echo "::error::Variables に BUNDLE_PREFIX が登録されていません"; exit 1; fi
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Save API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # iPhone でコピーすると改行が消えたり余計な文字が入ったりするので、鍵の形式を整え直す
          python3 - <<'PY'
          import os, re, base64, sys
          raw = os.environ["ASC_KEY_P8"]
          body = re.sub(r"-----(BEGIN|END)[^-]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          try:
              der = base64.b64decode(body + "=" * (-len(body) % 4))
          except Exception:
              der = b""
          if len(der) < 100:
              print("::error::ASC_KEY_P8 の中身が正しくありません（取り出せた鍵データ %d バイト）。.p8 の中身を全部貼り直してください" % len(der))
              sys.exit(1)
          b64 = base64.b64encode(der).decode()
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(b64[i:i+64] for i in range(0, len(b64), 64)) + "\n-----END PRIVATE KEY-----\n"
          open(os.path.join(os.environ["RUNNER_TEMP"], "keys", "AuthKey.p8"), "w").write(pem)
          print("鍵の形式を確認しました（%d バイト）" % len(der))
          PY
          # 前後の空白・改行を除いた値を以降のステップで使う
          {
            echo "KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
            echo "ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
            echo "TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')"
          } >> "$GITHUB_ENV"
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Select Xcode 26 or later（Apple のアップロード要件）
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Xcode 26 以降が見つかりません: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (署名は API キーで自動)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PadGuide.xcodeproj -scheme PadGuide -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PadGuide.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PD_BUNDLE_PREFIX="$BUNDLE_PREFIX" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee "$RUNNER_TEMP/archive.log" || {
              # 失敗理由を Actions の注釈に出す（ログを開かなくても見えるように）
              { grep -E ": error:" "$RUNNER_TEMP/archive.log"; grep -iE "error:|no profile|provisioning profile.*(doesn't|not)|certificate" "$RUNNER_TEMP/archive.log"; } \
                | sed -E 's#^/Users/runner/work/PadGuide/PadGuide/##' | awk '!seen[$0]++' | head -8 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
              tail -1 "$RUNNER_TEMP/archive.log" | while IFS= read -r l; do echo "::error::[末尾] ${l:0:900}"; done
              exit 1
            }

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PadGuide.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" || {
              grep -iE "error|fail" "$RUNNER_TEMP/export.log" | sort -u | head -6 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
              tail -3 "$RUNNER_TEMP/export.log" | while IFS= read -r l; do echo "::error::[末尾] ${l:0:900}"; done
              exit 1
            }
          echo "アップロード完了。10〜30分ほどで TestFlight アプリに表示されます。"

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
