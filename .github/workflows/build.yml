name: Build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PadGuide-android-apk
          path: android/app/build/outputs/apk/release/*.apk

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned IPA (SideStore / AltStore で署名してインストール)
        working-directory: ios
        run: |
          xcodebuild -project PadGuide.xcodeproj -target PadGuide -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Release-iphoneos/PadGuide.app Payload/
          zip -qry PadGuide-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PadGuide-ios-unsigned-ipa
          path: ios/PadGuide-unsigned.ipa
