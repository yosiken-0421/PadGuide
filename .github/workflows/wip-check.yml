name: WIP check (一時)
on:
  push:
    branches: ["wip/**"]
jobs:
  core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1); sudo xcode-select -s "$X/Contents/Developer"
      - name: swift test
        run: |
          set -o pipefail
          swift test --package-path ios/PuzzleCore 2>&1 | tee /tmp/t.log || {
            grep -E "error:|failed|XCTAssert" /tmp/t.log | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | awk '!s[$0]++' | head -40 | while IFS= read -r l; do echo "::error::${l:0:600}"; done
            exit 1; }
          grep -E "Executed|passed" /tmp/t.log | tail -3 | while IFS= read -r l; do echo "::notice::$l"; done
