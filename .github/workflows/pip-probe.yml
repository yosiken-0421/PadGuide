name: PiP probe (一時)
on:
  push:
    branches: ["wip/pip2"]
jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1); sudo xcode-select -s "$X/Contents/Developer"
          brew install xcodegen >/dev/null && (cd ios && xcodegen generate >/dev/null)
          xcrun simctl list devicetypes | grep -E "iPhone|iPad" | sed 's/^/TYPE /' | head -60
      - name: build for testing
        run: |
          .github/scripts/run-logged.sh bft xcodebuild build-for-testing -project ios/PuzzleRoute.xcodeproj -scheme PuzzleRoute \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO -quiet
      - name: probe devices
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import sys, json
          rs=[r for r in json.load(sys.stdin)['runtimes'] if r.get('platform')=='iOS' and r.get('isAvailable')]
          rs.sort(key=lambda r:[int(x) for x in r['version'].split('.')]); print(rs[-1]['identifier'])")
          echo "::notice title=runtime::$RUNTIME"
          for T in iPhone-17-Pro iPhone-16 iPhone-12-mini iPad-Pro-11-inch-M4-8GB iPad-Air-11-inch-M3; do
            UDID=$(xcrun simctl create "P $T" com.apple.CoreSimulator.SimDeviceType.$T "$RUNTIME" 2>/dev/null || true)
            if [ -z "$UDID" ]; then echo "::notice title=$T::作成できない"; continue; fi
            xcodebuild test-without-building -project ios/PuzzleRoute.xcodeproj -scheme PuzzleRoute \
              -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
              -only-testing:PuzzleRouteUITests/PuzzleRouteUITests/testPictureInPictureStartsAndShowsRoute > "$RUNNER_TEMP/$T.log" 2>&1
            R=$?
            MSG=$(grep -oE "(小窓[^\"]{0,220}|PIPCHECK: .*|Executed [0-9]+ test.*)" "$RUNNER_TEMP/$T.log" | sort -u | head -4 | tr '\n' ' | ')
            echo "::notice title=$T (exit $R)::${MSG:0:900}"
            xcrun simctl delete "$UDID" || true
          done
