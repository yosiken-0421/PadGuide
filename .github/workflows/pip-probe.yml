name: PiP probe (一時)
on:
  push:
    branches: ["wip/guide"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1); sudo xcode-select -s "$X/Contents/Developer"
          brew install xcodegen >/dev/null && (cd ios && xcodegen generate >/dev/null)
      - name: capture
        run: |
          set +e
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import sys, json
          rs=[r for r in json.load(sys.stdin)['runtimes'] if r.get('platform')=='iOS' and r.get('isAvailable')]
          rs.sort(key=lambda r:[int(x) for x in r['version'].split('.')]); print(rs[-1]['identifier'])")
          UDID=$(xcrun simctl create "P" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME")
          xcodebuild test -project ios/PuzzleRoute.xcodeproj -scheme PuzzleRoute -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/r.xcresult" CODE_SIGNING_ALLOWED=NO \
            -only-testing:PuzzleRouteUITests/PuzzleRouteUITests/testCapturePiPPreview > "$RUNNER_TEMP/t.log" 2>&1
          mkdir -p "$RUNNER_TEMP/out"
          grep -E "error:|Executed" "$RUNNER_TEMP/t.log" | sort -u | head > "$RUNNER_TEMP/out/result.txt"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/r.xcresult" --output-path "$RUNNER_TEMP/out" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP"/out/*.mp4
          cd "$RUNNER_TEMP/out" && git init -q && git checkout -q -b wip/probe-out
          git -c user.name=probe -c user.email=probe@invalid add -A && git -c user.name=probe -c user.email=probe@invalid commit -q -m out
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" wip/probe-out
