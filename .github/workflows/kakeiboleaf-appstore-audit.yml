name: KakeiboLeaf App Store Audit

on:
  push:
    branches:
      - app/local-ledger-v1
    paths:
      - ".github/workflows/kakeiboleaf-appstore-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          chmod 700 "$RUNNER_TEMP/asc"
          python3 - <<'PY'
          import os,re,base64,sys
          for v in ("ASC_KEY_ID","ASC_ISSUER_ID","ASC_KEY_P8"):
              if not os.environ.get(v):
                  print(f"::error::Missing {v}")
                  sys.exit(1)
          raw=os.environ["ASC_KEY_P8"]
          body=re.sub(r"-----(BEGIN|END)[^-]*-----","",raw)
          body=re.sub(r"[^A-Za-z0-9+/=]","",body)
          der=base64.b64decode(body + "=" * (-len(body) % 4))
          if len(der) < 100:
              print("::error::Invalid ASC private key")
              sys.exit(1)
          b64=base64.b64encode(der).decode()
          pem="-----BEGIN PRIVATE KEY-----\n" + "\n".join(b64[i:i+64] for i in range(0,len(b64),64)) + "\n-----END PRIVATE KEY-----\n"
          path=os.path.join(os.environ["RUNNER_TEMP"],"asc","AuthKey.p8")
          open(path,"w").write(pem)
          os.chmod(path,0o600)
          PY
          echo "ASC_KEY_ID_CLEAN=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID_CLEAN=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Audit KakeiboLeaf App Store state
        env:
          BUNDLE_ID: com.yosiken0421.localkakeibo
        run: |
          python3 -m venv "$RUNNER_TEMP/asc/venv"
          "$RUNNER_TEMP/asc/venv/bin/python" -m pip install --quiet pyjwt cryptography requests

          "$RUNNER_TEMP/asc/venv/bin/python" - <<'PY'
          import os,time,sys,jwt,requests,json

          with open(os.path.join(os.environ["RUNNER_TEMP"],"asc","AuthKey.p8")) as f:
              key=f.read()
          now=int(time.time())
          token=jwt.encode(
              {"iss":os.environ["ASC_ISSUER_ID_CLEAN"],"iat":now,"exp":now+900,"aud":"appstoreconnect-v1"},
              key,algorithm="ES256",
              headers={"kid":os.environ["ASC_KEY_ID_CLEAN"],"typ":"JWT"},
          )
          H={"Authorization":f"Bearer {token}"}
          base="https://api.appstoreconnect.apple.com/v1"

          def get(path, params=None, allow=(200,)):
              r=requests.get(base+path,headers=H,params=params or {},timeout=30)
              print(f"GET {path} -> {r.status_code}")
              if r.status_code not in allow:
                  print(r.text[:2500])
                  return None
              return r.json()

          apps=get("/apps",{"filter[bundleId]":os.environ["BUNDLE_ID"],"limit":"10"})
          if not apps or not apps.get("data"):
              print("::error::App record not found")
              sys.exit(1)

          app=apps["data"][0]
          app_id=app["id"]
          attrs=app.get("attributes",{})
          print("APP", json.dumps({
              "id":app_id,
              "name":attrs.get("name"),
              "bundleId":attrs.get("bundleId"),
              "sku":attrs.get("sku"),
              "primaryLocale":attrs.get("primaryLocale"),
          }, ensure_ascii=False))

          versions=get(f"/apps/{app_id}/appStoreVersions",{"filter[platform]":"IOS","limit":"50"})
          rows=(versions or {}).get("data",[])
          print("VERSIONS_COUNT",len(rows))
          for row in rows:
              a=row.get("attributes",{})
              version_id=row["id"]
              print("VERSION", json.dumps({
                  "id":version_id,
                  "versionString":a.get("versionString"),
                  "appStoreState":a.get("appStoreState"),
                  "platform":a.get("platform"),
                  "createdDate":a.get("createdDate"),
              }, ensure_ascii=False))

              locs=get(f"/appStoreVersions/{version_id}/appStoreVersionLocalizations",{"limit":"50"})
              for loc in (locs or {}).get("data",[]):
                  la=loc.get("attributes",{})
                  print("LOCALIZATION", json.dumps({
                      "id":loc["id"],
                      "locale":la.get("locale"),
                      "description":bool(la.get("description")),
                      "keywords":bool(la.get("keywords")),
                      "supportUrl":la.get("supportUrl"),
                      "marketingUrl":la.get("marketingUrl"),
                      "promotionalText":bool(la.get("promotionalText")),
                      "whatsNew":bool(la.get("whatsNew")),
                  }, ensure_ascii=False))

              rel=get(f"/appStoreVersions/{version_id}/build")
              if rel and rel.get("data"):
                  print("VERSION_BUILD_ID",rel["data"].get("id"))
              else:
                  print("VERSION_BUILD_ID",None)

          builds=get("/builds",{"filter[app]":app_id,"limit":"20","sort":"-uploadedDate"})
          for row in (builds or {}).get("data",[])[:10]:
              a=row.get("attributes",{})
              print("BUILD", json.dumps({
                  "id":row["id"],
                  "version":a.get("version"),
                  "processingState":a.get("processingState"),
                  "uploadedDate":a.get("uploadedDate"),
                  "expired":a.get("expired"),
              }, ensure_ascii=False))

          infos=get(f"/apps/{app_id}/appInfos",{"limit":"10"})
          for row in (infos or {}).get("data",[]):
              a=row.get("attributes",{})
              info_id=row["id"]
              print("APP_INFO",json.dumps({
                  "id":info_id,
                  "appStoreState":a.get("appStoreState"),
              },ensure_ascii=False))

              info_locs=get(f"/appInfos/{info_id}/appInfoLocalizations",{"limit":"50"})
              for loc in (info_locs or {}).get("data",[]):
                  la=loc.get("attributes",{})
                  print("APP_INFO_LOCALIZATION",json.dumps({
                      "id":loc["id"],
                      "locale":la.get("locale"),
                      "name":la.get("name"),
                      "subtitle":la.get("subtitle"),
                      "privacyPolicyUrl":la.get("privacyPolicyUrl"),
                      "privacyChoicesUrl":la.get("privacyChoicesUrl"),
                  },ensure_ascii=False))

              for rel_name in ("primaryCategory","secondaryCategory"):
                  rel=get(f"/appInfos/{info_id}/relationships/{rel_name}")
                  rid=((rel or {}).get("data") or {}).get("id")
                  print(f"APP_INFO_{rel_name.upper()}_ID",rid)

              age=get(f"/appInfos/{info_id}/ageRatingDeclaration")
              if age and age.get("data"):
                  print("AGE_RATING",json.dumps({
                      "id":age["data"]["id"],
                      "attributes":age["data"].get("attributes",{})
                  },ensure_ascii=False,sort_keys=True))

          cats=get("/appCategories",{"filter[platforms]":"IOS","exists[parent]":"false","limit":"200"})
          for row in (cats or {}).get("data",[]):
              print("CATEGORY",json.dumps({"id":row["id"]},ensure_ascii=False))
          PY

      - name: Configure KakeiboLeaf App Store metadata
        env:
          BUNDLE_ID: com.yosiken0421.localkakeibo
        run: |
          "$RUNNER_TEMP/asc/venv/bin/python" - <<'PY'
          import os,time,sys,jwt,requests

          APP_NAME="KakeiboLeaf"
          APP_SUBTITLE="シンプルな収支記録を端末内で"
          PRIVACY_URL="https://github.com/yosiken-0421/PadGuide/blob/main/apps/LocalLedger/PRIVACY.md"
          SUPPORT_URL="https://github.com/yosiken-0421/PadGuide/blob/main/apps/LocalLedger/SUPPORT.md"
          DESCRIPTION="""KakeiboLeafは、毎日の収入と支出を迷わずすぐ記録できるシンプルな家計簿です。

金額・カテゴリ・日付・メモを入力すると、月ごとの収入、支出、残高を自動集計します。月予算を設定すると残り予算も確認できます。

「分析」では直近6か月の支出推移とカテゴリ別支出を確認できます。記録の検索・編集・削除にも対応しています。

家計簿データはiPhone内だけに保存されます。アカウント登録、広告、アクセス解析、トラッキング、外部クラウドへの送信はありません。"""
          KEYWORDS="家計簿,収支,支出,収入,節約,お金,予算,記録,シンプル"

          with open(os.path.join(os.environ["RUNNER_TEMP"],"asc","AuthKey.p8")) as f:
              key=f.read()
          now=int(time.time())
          token=jwt.encode(
              {"iss":os.environ["ASC_ISSUER_ID_CLEAN"],"iat":now,"exp":now+900,"aud":"appstoreconnect-v1"},
              key,algorithm="ES256",
              headers={"kid":os.environ["ASC_KEY_ID_CLEAN"],"typ":"JWT"},
          )
          H={"Authorization":f"Bearer {token}","Content-Type":"application/json"}
          base="https://api.appstoreconnect.apple.com/v1"

          def req(method,path,params=None,payload=None,ok=(200,201,204)):
              r=requests.request(method,base+path,headers=H,params=params,json=payload,timeout=30)
              print(f"{method} {path} -> {r.status_code}")
              if r.status_code not in ok:
                  print(r.text[:4000])
                  sys.exit(1)
              if r.status_code == 204 or not r.text.strip():
                  return None
              return r.json()

          apps=req("GET","/apps",params={"filter[bundleId]":os.environ["BUNDLE_ID"],"limit":"10"})
          app=apps["data"][0]
          app_id=app["id"]

          versions=req("GET",f"/apps/{app_id}/appStoreVersions",params={"filter[platform]":"IOS","limit":"50"})
          version=next(x for x in versions["data"] if x.get("attributes",{}).get("versionString")=="1.0")
          version_id=version["id"]

          version_locs=req("GET",f"/appStoreVersions/{version_id}/appStoreVersionLocalizations",params={"limit":"50"})
          version_loc=next(x for x in version_locs["data"] if x.get("attributes",{}).get("locale")=="ja")
          version_loc_id=version_loc["id"]

          infos=req("GET",f"/apps/{app_id}/appInfos",params={"limit":"10"})
          info_id=infos["data"][0]["id"]

          info_locs=req("GET",f"/appInfos/{info_id}/appInfoLocalizations",params={"limit":"50"})
          info_loc=next(x for x in info_locs["data"] if x.get("attributes",{}).get("locale")=="ja")
          info_loc_id=info_loc["id"]

          builds=req("GET","/builds",params={"filter[app]":app_id,"filter[version]":"2002","limit":"10"})
          build=next(x for x in builds["data"] if x.get("attributes",{}).get("processingState")=="VALID")
          build_id=build["id"]

          req("PATCH",f"/apps/{app_id}",payload={
              "data":{
                  "type":"apps",
                  "id":app_id,
                  "attributes":{"contentRightsDeclaration":"DOES_NOT_USE_THIRD_PARTY_CONTENT"}
              }
          })

          req("PATCH",f"/appInfos/{info_id}",payload={
              "data":{
                  "type":"appInfos",
                  "id":info_id,
                  "relationships":{
                      "primaryCategory":{"data":{"type":"appCategories","id":"FINANCE"}},
                      "secondaryCategory":{"data":{"type":"appCategories","id":"UTILITIES"}}
                  }
              }
          })

          req("PATCH",f"/appInfoLocalizations/{info_loc_id}",payload={
              "data":{
                  "type":"appInfoLocalizations",
                  "id":info_loc_id,
                  "attributes":{
                      "name":APP_NAME,
                      "subtitle":APP_SUBTITLE,
                      "privacyPolicyUrl":PRIVACY_URL
                  }
              }
          })

          req("PATCH",f"/appStoreVersionLocalizations/{version_loc_id}",payload={
              "data":{
                  "type":"appStoreVersionLocalizations",
                  "id":version_loc_id,
                  "attributes":{
                      "description":DESCRIPTION,
                      "keywords":KEYWORDS,
                      "supportUrl":SUPPORT_URL
                  }
              }
          })

          req("PATCH",f"/appStoreVersions/{version_id}/relationships/build",payload={
              "data":{"type":"builds","id":build_id}
          },ok=(204,))

          age=req("GET",f"/appInfos/{info_id}/ageRatingDeclaration")
          age_id=age["data"]["id"]
          req("PATCH",f"/ageRatingDeclarations/{age_id}",payload={
              "data":{
                  "type":"ageRatingDeclarations",
                  "id":age_id,
                  "attributes":{
                      "advertising":False,
                      "alcoholTobaccoOrDrugUseOrReferences":"NONE",
                      "contests":"NONE",
                      "gambling":False,
                      "gamblingSimulated":"NONE",
                      "gunsOrOtherWeapons":"NONE",
                      "healthOrWellnessTopics":False,
                      "lootBox":False,
                      "medicalOrTreatmentInformation":"NONE",
                      "messagingAndChat":False,
                      "parentalControls":False,
                      "profanityOrCrudeHumor":"NONE",
                      "ageAssurance":False,
                      "sexualContentGraphicAndNudity":"NONE",
                      "sexualContentOrNudity":"NONE",
                      "socialMedia":False,
                      "socialMediaAgeRestricted":False,
                      "horrorOrFearThemes":"NONE",
                      "matureOrSuggestiveThemes":"NONE",
                      "unrestrictedWebAccess":False,
                      "userGeneratedContent":False,
                      "violenceCartoonOrFantasy":"NONE",
                      "violenceRealisticProlongedGraphicOrSadistic":"NONE",
                      "violenceRealistic":"NONE",
                      "ageRatingOverrideV2":"NONE",
                      "koreaAgeRatingOverride":"NONE"
                  }
              }
          })

          check=req("GET",f"/appStoreVersions/{version_id}/build")
          if check.get("data",{}).get("id") != build_id:
              print("::error::Build association verification failed")
              sys.exit(1)

          print("KakeiboLeaf App Store configuration complete")
          print("App ID:",app_id)
          print("Version ID:",version_id)
          print("Build ID:",build_id)
          PY

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
