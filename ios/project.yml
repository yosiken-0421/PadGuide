name: PadGuide
options:
  bundleIdPrefix: com.pdguide
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""                 # GitHub Actions では Secrets の APPLE_TEAM_ID で上書き
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"         # GitHub Actions では実行番号で上書き（毎回増える）
    PD_BUNDLE_PREFIX: com.yosiken0421.padguide
    PD_APP_GROUP: group.$(PD_BUNDLE_PREFIX)
targets:
  PadGuide:
    type: application
    platform: iOS
    sources:
      - PadGuide
      - Shared
    dependencies:
      - target: Broadcast
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PD_BUNDLE_PREFIX).app
        CODE_SIGN_ENTITLEMENTS: PadGuide/PadGuide.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PadGuide/Info.plist
      properties:
        CFBundleDisplayName: パズドラ矢印ガイド
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        PDAppGroup: $(PD_APP_GROUP)
    entitlements:
      path: PadGuide/PadGuide.entitlements
      properties:
        com.apple.security.application-groups: [$(PD_APP_GROUP)]

  Broadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PD_BUNDLE_PREFIX).app.broadcast
        CODE_SIGN_ENTITLEMENTS: Broadcast/Broadcast.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: パズドラ矢印ガイド
        PDAppGroup: $(PD_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        com.apple.security.application-groups: [$(PD_APP_GROUP)]
